<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>La lettre de la DRANE</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root {
    --marine: #0b3d5c;
    --bordeaux: #a51c30;
    --ardoise: #4a5568;
    --cyan: #29abe2;
    --vert: #8dc63f;
    --fond: #f2f4f6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--fond);
    color: #222;
  }
  .barre-outils {
    background: #ffffff;
    border-bottom: 1px solid #ddd;
    padding: 16px 24px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  }
  .barre-outils h1 {
    font-size: 16px;
    margin: 0;
    color: var(--marine);
    flex: 1;
  }
  .btn {
    background: var(--marine);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
  }
  .btn.secondaire {
    background: #ffffff;
    color: var(--marine);
    border: 2px solid var(--marine);
  }
  .btn:hover { opacity: 0.85; }
  input[type="file"] { display: none; }

  .filtres {
    max-width: 700px;
    margin: 20px auto 0 auto;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    padding: 0 16px;
  }
  .filtre-tag {
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
    border: 2px solid var(--marine);
    background: #fff;
    color: var(--marine);
    cursor: pointer;
    user-select: none;
  }
  .filtre-tag.actif {
    background: var(--marine);
    color: #fff;
  }

  #zone-newsletter {
    max-width: 700px;
    margin: 20px auto 32px auto;
    background: #ffffff;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  .en-tete-logos {
    background: #ffffff;
    padding: 20px 32px 0 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }
  .en-tete-logos img {
    height: 56px;
    object-fit: contain;
  }
  .en-tete {
    background: var(--marine);
    color: #fff;
    padding: 24px 32px 28px 32px;
    text-align: center;
    margin-top: 16px;
  }
  .en-tete .surtitre {
    font-size: 11.5px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #a9d4ea;
    margin: 0 0 6px 0;
  }
  .en-tete h2 {
    margin: 0;
    font-size: 24px;
    line-height: 1.3;
  }
  .en-tete .date-edition {
    margin-top: 8px;
    font-size: 13px;
    color: #cfe8f7;
  }
  .intro {
    padding: 28px 32px 8px 32px;
    font-size: 15px;
    line-height: 1.6;
  }
  .section-titre {
    padding: 16px 32px 8px 32px;
    font-size: 18px;
    font-weight: bold;
    color: var(--marine);
    border-top: 3px solid #eef1f6;
    margin-top: 8px;
  }
  .bloc-evenements {
    padding: 8px 32px 24px 32px;
  }
  .evenement {
    display: flex;
    gap: 16px;
    background: #f7f9fc;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 12px;
    align-items: center;
  }
  .date-badge {
    background: var(--marine);
    color: #fff;
    border-radius: 6px;
    text-align: center;
    min-width: 60px;
    padding: 8px 4px;
  }
  .date-badge .mois {
    font-size: 11px;
    text-transform: uppercase;
    font-weight: bold;
  }
  .date-badge .jour {
    font-size: 20px;
    font-weight: bold;
  }
  .evenement h4 { margin: 0 0 4px 0; font-size: 14.5px; }
  .evenement p { margin: 0; font-size: 13px; color: #555; line-height: 1.4; }

  .categorie-bloc { padding: 8px 32px 8px 32px; }
  .categorie-titre {
    font-size: 16px;
    font-weight: bold;
    color: var(--ardoise);
    margin: 20px 0 10px 0;
    padding-bottom: 6px;
    border-bottom: 2px solid #eef1f6;
  }
  .grille-articles {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 600px) {
    .grille-articles { grid-template-columns: 1fr; }
    .en-tete-logos { flex-wrap: wrap; }
  }
  .carte {
    border-radius: 10px;
    padding: 18px;
    background: #f7f9fc;
    border-left: 5px solid var(--marine);
    display: flex;
    flex-direction: column;
  }
  .carte.masque { display: none; }
  .tags-publics {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .tag-public {
    display: inline-block;
    font-size: 10.5px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: #fff;
    padding: 3px 9px;
    border-radius: 12px;
  }
  .tag-public.enseignants { background: var(--marine); }
  .tag-public.eleves { background: var(--cyan); }
  .tag-public.parents { background: var(--vert); }
  .carte h3 { font-size: 15px; margin: 0 0 8px 0; color: #111; }
  .carte p {
    font-size: 13.5px;
    line-height: 1.5;
    color: #555;
    margin: 0 0 12px 0;
    flex: 1;
  }
  .carte a {
    font-size: 13px;
    font-weight: bold;
    color: var(--bordeaux);
    text-decoration: none;
  }
  .pied {
    background: #f7f9fc;
    padding: 20px 32px;
    text-align: center;
    font-size: 12px;
    color: #888;
  }
  .pied a { color: var(--marine); }
  #zone-vide {
    max-width: 700px;
    margin: 60px auto;
    text-align: center;
    color: #888;
    padding: 40px;
  }
  @media print {
    .barre-outils, .filtres { display: none; }
    #zone-newsletter { box-shadow: none; margin: 0; }
  }
</style>
</head>
<body>

<div class="barre-outils">
  <h1>La lettre de la DRANE — Générateur</h1>
  <label class="btn secondaire" for="fichier-excel">📂 Importer Excel (.xlsx)</label>
  <input type="file" id="fichier-excel" accept=".xlsx,.xls" />
  <button class="btn secondaire" id="btn-json">📄 Utiliser data.json</button>
  <button class="btn" id="btn-pdf">⬇️ Exporter en PDF</button>
</div>

<div class="filtres" id="zone-filtres" style="display:none;">
  <span class="filtre-tag actif" data-public="tous">Tous</span>
  <span class="filtre-tag" data-public="Enseignants">Enseignants</span>
  <span class="filtre-tag" data-public="Élèves">Élèves</span>
  <span class="filtre-tag" data-public="Parents">Parents</span>
</div>

<div id="zone-vide">
  Importez un fichier Excel (modele_donnees.xlsx) ou cliquez sur « Utiliser data.json » pour afficher la newsletter.
</div>

<div id="zone-newsletter" style="display:none;">
  <div class="en-tete-logos">
    <img src="logo_drane.png" alt="DRANE Hauts-de-France" onerror="this.style.display='none'" />
    <img src="logo_academie_lille.png" alt="Académie de Lille" onerror="this.style.display='none'" />
  </div>
  <div class="en-tete">
    <p class="surtitre" id="v-nom-newsletter"></p>
    <h2 id="v-titre-edition"></h2>
    <p class="date-edition" id="v-date-edition"></p>
  </div>
  <div class="intro" id="v-texte-intro"></div>

  <div class="section-titre">📅 Événements à venir</div>
  <div class="bloc-evenements" id="conteneur-evenements"></div>

  <div class="categorie-bloc" id="conteneur-categories"></div>

  <div class="pied">
    <p>Délégation de région académique au numérique éducatif — Hauts-de-France</p>
    <p>Contact : <a id="v-email-contact" href="#"></a></p>
  </div>
</div>

<script>
let donneesActuelles = null;
let filtrePublicActif = 'tous';

function slugPublic(p) {
  return p.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}

function rendreNewsletter(data) {
  donneesActuelles = data;
  document.getElementById('zone-vide').style.display = 'none';
  document.getElementById('zone-newsletter').style.display = 'block';
  document.getElementById('zone-filtres').style.display = 'flex';

  const c = data.contenu;
  document.getElementById('v-nom-newsletter').textContent = c.nom_newsletter || '';
  document.getElementById('v-titre-edition').textContent = c.titre_edition || '';
  document.getElementById('v-date-edition').textContent = c.date_edition || '';
  document.getElementById('v-texte-intro').textContent = c.texte_intro || '';
  const emailEl = document.getElementById('v-email-contact');
  emailEl.textContent = c.email_contact || '';
  emailEl.href = 'mailto:' + (c.email_contact || '');
  document.title = c.titre_newsletter || 'La lettre de la DRANE';

  const cEv = document.getElementById('conteneur-evenements');
  cEv.innerHTML = '';
  (data.evenements || []).forEach(ev => {
    const div = document.createElement('div');
    div.className = 'evenement';
    div.innerHTML = `
      <div class="date-badge">
        <div class="mois">${ev.mois || ''}</div>
        <div class="jour">${ev.jour || ''}</div>
      </div>
      <div>
        <h4>${ev.titre || ''}</h4>
        <p>${ev.description || ''}</p>
      </div>`;
    cEv.appendChild(div);
  });

  const cCat = document.getElementById('conteneur-categories');
  cCat.innerHTML = '';
  const categories = {};
  (data.articles || []).forEach(art => {
    const cat = art.categorie || 'Autre';
    if (!categories[cat]) categories[cat] = [];
    categories[cat].push(art);
  });

  Object.keys(categories).forEach(cat => {
    const titreCat = document.createElement('div');
    titreCat.className = 'categorie-titre';
    titreCat.textContent = cat;
    cCat.appendChild(titreCat);

    const grille = document.createElement('div');
    grille.className = 'grille-articles';

    categories[cat].forEach(art => {
      const couleur = art.couleur_tag || '#0b3d5c';
      const publics = art.publics || (art.public_cible ? [art.public_cible] : []);
      const div = document.createElement('div');
      div.className = 'carte';
      div.dataset.publics = publics.join(',');
      div.style.borderLeftColor = couleur;

      const tagsHtml = publics.map(p => {
        const slug = slugPublic(p);
        return `<span class="tag-public ${slug}">${p}</span>`;
      }).join('');

      div.innerHTML = `
        <div class="tags-publics">${tagsHtml}</div>
        <h3>${art.titre || ''}</h3>
        <p>${art.description || ''}</p>
        <a href="${art.lien_url || '#'}" target="_blank">${art.lien_texte || 'En savoir plus'} →</a>`;
      grille.appendChild(div);
    });

    cCat.appendChild(grille);
  });

  appliquerFiltre();
}

function appliquerFiltre() {
  const cartes = document.querySelectorAll('.carte');
  cartes.forEach(carte => {
    if (filtrePublicActif === 'tous') {
      carte.classList.remove('masque');
    } else {
      const publics = (carte.dataset.publics || '').split(',');
      if (publics.includes(filtrePublicActif)) {
        carte.classList.remove('masque');
      } else {
        carte.classList.add('masque');
      }
    }
  });

  document.querySelectorAll('.categorie-titre').forEach(titre => {
    const grille = titre.nextElementSibling;
    const visibles = grille.querySelectorAll('.carte:not(.masque)').length;
    titre.style.display = visibles === 0 ? 'none' : '';
    grille.style.display = visibles === 0 ? 'none' : 'grid';
  });
}

document.querySelectorAll('.filtre-tag').forEach(tag => {
  tag.addEventListener('click', function() {
    document.querySelectorAll('.filtre-tag').forEach(t => t.classList.remove('actif'));
    this.classList.add('actif');
    filtrePublicActif = this.dataset.public;
    appliquerFiltre();
  });
});

function excelVersJSON(workbook) {
  const feuille = (nom) => XLSX.utils.sheet_to_json(workbook.Sheets[nom] || {}, {defval:''});

  const contenuRows = feuille('Contenu');
  const contenu = {};
  contenuRows.forEach(r => { contenu[r.Champ] = r.Valeur; });

  const articlesRaw = feuille('Articles');
  const articles = articlesRaw.map(a => ({
    ...a,
    publics: (a.publics || '').split(',').map(s => s.trim()).filter(Boolean)
  }));

  const evenements = feuille('Evenements');

  return { contenu, articles, evenements };
}

document.getElementById('fichier-excel').addEventListener('change', function(e) {
  const fichier = e.target.files[0];
  if (!fichier) return;
  const lecteur = new FileReader();
  lecteur.onload = function(evt) {
    const data = new Uint8Array(evt.target.result);
    const workbook = XLSX.read(data, {type: 'array'});
    const json = excelVersJSON(workbook);
    rendreNewsletter(json);
  };
  lecteur.readAsArrayBuffer(fichier);
});

document.getElementById('btn-json').addEventListener('click', function() {
  fetch('data.json')
    .then(r => r.json())
    .then(json => rendreNewsletter(json))
    .catch(err => alert('Impossible de charger data.json : ' + err));
});

document.getElementById('btn-pdf').addEventListener('click', function() {
  const element = document.getElementById('zone-newsletter');
  if (element.style.display === 'none') {
    alert('Importez d\'abord des données (Excel ou data.json) avant d\'exporter en PDF.');
    return;
  }
  const opt = {
    margin: 0,
    filename: 'lettre-drane.pdf',
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
  };
  html2pdf().set(opt).from(element).save();
});
</script>

</body>
</html>
